name: Static site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test audit tools
        run: python3 -m unittest discover -s tests -p '*test*.py'
      - name: Test cookie behaviour
        run: node --test tests/cookies.test.js
      - name: Check active JavaScript syntax
        run: python3 tools/check_javascript.py --include-archives
      - name: Check local references against documented pending issues
        run: python3 tools/audit_site.py --include-archives --baseline docs/audit/archive-issues.json
      - name: Check generated sitemap
        run: python3 tools/generate_sitemap.py --check
